
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DartsGo – Adatvédelmi tájékoztató</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0F0B17;
      color: #F5F3FF;
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 580px;
      padding: 36px;
      background: #1D1830;
      border: 1px solid #413653;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      color: #A78BFA;
      font-size: 2rem;
    }

    h2 {
      font-size: 1.2rem;
    }

    p {
      color: #C4B5D9;
      line-height: 1.7;
    }

    .notice {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      background: #29213F;
    }
  </style>
</head>
<body>
  <main>
    <h1>DartsGo</h1>
    <h2>Adatvédelmi tájékoztató</h2>

    <div class="notice">
      <p>
        A DartsGo hivatalos adatkezelési
        tájékoztatója előkészítés alatt áll.
      </p>
      <p>
        Ez az oldal jelenleg technikai tesztoldal,
        nem minősül végleges adatkezelési
        tájékoztatónak.
      </p>
    </div>
  </main>
</body>
</html>
